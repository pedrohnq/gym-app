<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D10" />
  <meta name="description" content="Aplicativo de treino para usar durante a musculação." />
  <title>Treino</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg" />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Header fixo: cronômetro + progresso do treino -->
    <header id="app-header" class="app-header" hidden>
      <div class="app-header__row">
        <h1 id="workout-title" class="app-header__title">Treino</h1>
        <div id="workout-clock" class="clock" aria-live="off" aria-label="Tempo de treino">00:00</div>
      </div>
      <div class="progress" role="progressbar" aria-label="Progresso do treino"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress__fill" style="width:0%"></div>
      </div>
      <div id="progress-label" class="app-header__sub">0/0 exercícios</div>
    </header>

    <!-- Área de conteúdo trocável (telas) -->
    <main id="screen" class="screen" aria-live="polite"></main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
